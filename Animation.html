<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Moving Box</title>

    <style>
        body {
            margin: 0;
            height: 100vh;
            background-color: #222;
            position: relative;
            overflow: hidden;
        }

        .small-box {
            width: 50px;
            height: 50px;
            background-color: #00bfff;
            position: absolute;
            top: 0;
            left: 0;
            animation: moveBox 3s linear infinite alternate;
        }

        @keyframes moveBox {
            from {
                left: 0;
            }

            to {
                left: calc(100% - 50px);
            }
        }
    </style>
</head>

<body>

    <div class="small-box"></div>

</body>
</html>
